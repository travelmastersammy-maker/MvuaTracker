services:
  - type: web
    name: mvuatracker-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mvuatracker-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: mvuatracker-db
    databaseName: mvuatracker
    user: mvuatracker
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
